<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Let us redesign your website"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010403"/><stop offset="1" stop-color="#03120A"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3DE08A"/><stop offset=".5" stop-color="#2FE0B0"/><stop offset="1" stop-color="#E2FF7A"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="d" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".09"/></pattern></defs><clipPath id="r"><rect width="1200" height="220" rx="22"/></clipPath><g clip-path="url(#r)"><rect width="1200" height="220" fill="url(#bg)"/><rect width="1200" height="220" fill="url(#d)"/><g filter="url(#b)"><ellipse cx="300" cy="200" rx="300" ry="90" fill="#2EBD74" fill-opacity=".3"><animateTransform attributeName="transform" type="translate" values="0 0;400 -20;0 0" dur="14s" repeatCount="indefinite"/></ellipse><ellipse cx="900" cy="20" rx="280" ry="80" fill="#6FAE3B" fill-opacity=".25"/></g>
<text x="600" y="112" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="url(#g)" letter-spacing="-1">Let's redesign your website.</text>
<text x="600" y="164" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="24" font-weight="700" fill="#B5D86A">contact@teamredesign.com</text></g></svg>