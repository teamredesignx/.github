<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Process: Audit, Architect, Design, Build and Launch"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030A06"/><stop offset="1" stop-color="#08170F"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2EBD74"/><stop offset=".5" stop-color="#1A9E7C"/><stop offset="1" stop-color="#B5D86A"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="d" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".09"/></pattern></defs>
<line x1="150" y1="40" x2="1050" y2="40" stroke="#2EBD74" stroke-opacity=".35" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="4s" repeatCount="indefinite"/></line>
<circle cx="150" cy="40" r="24" fill="#08170F" stroke="#2EBD74"/><text x="150" y="45" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#B5D86A">01</text><text x="150" y="100" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Audit</text><text x="150" y="126" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB5A2">Find what hurts speed,</text><text x="150" y="145" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB5A2">clarity and conversion.</text><circle cx="450" cy="40" r="24" fill="#08170F" stroke="#2EBD74"/><text x="450" y="45" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#B5D86A">02</text><text x="450" y="100" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Architect</text><text x="450" y="126" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB5A2">Structure content, flows</text><text x="450" y="145" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB5A2">and the component system.</text><circle cx="750" cy="40" r="24" fill="#08170F" stroke="#2EBD74"/><text x="750" y="45" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#B5D86A">03</text><text x="750" y="100" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Design</text><text x="750" y="126" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB5A2">Craft a bold, accessible</text><text x="750" y="145" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB5A2">visual language.</text><circle cx="1050" cy="40" r="24" fill="#08170F" stroke="#2EBD74"/><text x="1050" y="45" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#B5D86A">04</text><text x="1050" y="100" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Build &amp; Launch</text><text x="1050" y="126" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB5A2">Ship fast on Next.js with</text><text x="1050" y="145" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8FB5A2">motion that earns its place.</text></svg>