<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Process: Audit, Architect, Design, Build and Launch"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010403"/><stop offset="1" stop-color="#03120A"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3DE08A"/><stop offset=".5" stop-color="#2FE0B0"/><stop offset="1" stop-color="#E2FF7A"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="d" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".09"/></pattern></defs>
<rect width="1200" height="230" rx="22" fill="#010403" stroke="#2EBD74" stroke-opacity=".35"/><line x1="150" y1="40" x2="1050" y2="40" stroke="#2EBD74" stroke-opacity=".35" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="4s" repeatCount="indefinite"/></line>
<circle cx="150" cy="40" r="28" fill="#08170F" stroke="#2EBD74" stroke-width="2"/><text x="150" y="46" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="18" fill="#B5D86A">01</text><text x="150" y="108" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">Audit</text><text x="150" y="144" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#ffffff">Find what hurts speed,</text><text x="150" y="170" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#ffffff">clarity and conversion.</text><circle cx="450" cy="40" r="28" fill="#08170F" stroke="#2EBD74" stroke-width="2"/><text x="450" y="46" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="18" fill="#B5D86A">02</text><text x="450" y="108" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">Architect</text><text x="450" y="144" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#ffffff">Structure content, flows</text><text x="450" y="170" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#ffffff">and the component system.</text><circle cx="750" cy="40" r="28" fill="#08170F" stroke="#2EBD74" stroke-width="2"/><text x="750" y="46" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="18" fill="#B5D86A">03</text><text x="750" y="108" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">Design</text><text x="750" y="144" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#ffffff">Craft a bold, accessible</text><text x="750" y="170" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#ffffff">visual language.</text><circle cx="1050" cy="40" r="28" fill="#08170F" stroke="#2EBD74" stroke-width="2"/><text x="1050" y="46" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="18" fill="#B5D86A">04</text><text x="1050" y="108" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">Build &amp; Launch</text><text x="1050" y="144" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#ffffff">Ship fast on Next.js with</text><text x="1050" y="170" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#ffffff">motion that earns its place.</text></svg>