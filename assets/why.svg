<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Faster, clearer, memorable websites"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030A06"/><stop offset="1" stop-color="#08170F"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2EBD74"/><stop offset=".5" stop-color="#1A9E7C"/><stop offset="1" stop-color="#B5D86A"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="d" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".09"/></pattern></defs>
<g transform="translate(20 10)"><rect width="372" height="210" rx="22" fill="url(#bg)" stroke="#2EBD74" stroke-opacity=".45" stroke-width="1.5"/><rect x="28" y="30" width="48" height="6" rx="3" fill="#2EBD74"/><text x="28" y="96" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="#fff">Faster</text><text x="28" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#d4ebdf">Pages that load in a blink,</text><text x="28" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#d4ebdf">so visitors stay.</text></g><g transform="translate(414 10)"><rect width="372" height="210" rx="22" fill="url(#bg)" stroke="#1A9E7C" stroke-opacity=".45" stroke-width="1.5"/><rect x="28" y="30" width="48" height="6" rx="3" fill="#1A9E7C"/><text x="28" y="96" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="#fff">Clearer</text><text x="28" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#d4ebdf">Structure and copy that</text><text x="28" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#d4ebdf">guide people to act.</text></g><g transform="translate(808 10)"><rect width="372" height="210" rx="22" fill="url(#bg)" stroke="#B5D86A" stroke-opacity=".45" stroke-width="1.5"/><rect x="28" y="30" width="48" height="6" rx="3" fill="#B5D86A"/><text x="28" y="96" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="#fff">Memorable</text><text x="28" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#d4ebdf">Motion and design nobody</text><text x="28" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#d4ebdf">mistakes for a template.</text></g></svg>