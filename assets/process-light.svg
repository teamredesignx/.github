<circle cx="150" cy="64" r="36" fill="#e6f6ed" stroke="#0a8f4f" stroke-width="2.5"/><text x="150" y="73" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="26" font-weight="700" fill="#4d6b00">01</text><text x="150" y="147" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#0b1f14">Audit</text><text x="150" y="195" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#0b1f14">Find what hurts</text><text x="150" y="231" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#0b1f14">speed and conversion</text><circle cx="450" cy="64" r="36" fill="#e6f6ed" stroke="#0a8f4f" stroke-width="2.5"/><text x="450" y="73" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="26" font-weight="700" fill="#4d6b00">02</text><text x="450" y="147" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#0b1f14">Architect</text><text x="450" y="195" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#0b1f14">Plan content, flows</text><text x="450" y="231" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#0b1f14">and components</text><circle cx="750" cy="64" r="36" fill="#e6f6ed" stroke="#0a8f4f" stroke-width="2.5"/><text x="750" y="73" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="26" font-weight="700" fill="#4d6b00">03</text><text x="750" y="147" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#0b1f14">Design</text><text x="750" y="195" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#0b1f14">Craft a bold,</text><text x="750" y="231" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#0b1f14">accessible look</text><circle cx="1050" cy="64" r="36" fill="#e6f6ed" stroke="#0a8f4f" stroke-width="2.5"/><text x="1050" y="73" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="26" font-weight="700" fill="#4d6b00">04</text><text x="1050" y="147" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#0b1f14">Launch</text><text x="1050" y="195" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#0b1f14">Ship fast, with</text><text x="1050" y="231" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#0b1f14">motion that earns it</text></svg>